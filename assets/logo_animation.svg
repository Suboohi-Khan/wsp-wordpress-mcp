<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  :root { --dur: 4s; }

  .moving-ball {
    animation: moveBall var(--dur) linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .diamond-line {
    stroke-dasharray: 1;
    animation: drawDiamond var(--dur) linear infinite;
  }
  .dynamic {
    animation: resetFade var(--dur) linear infinite;
  }
  .ball-top    { animation: pulseTop var(--dur) linear infinite;    transform-box: fill-box; transform-origin: center; }
  .ball-right  { animation: pulseRight var(--dur) linear infinite;  transform-box: fill-box; transform-origin: center; }
  .ball-bottom { animation: pulseBottom var(--dur) linear infinite; transform-box: fill-box; transform-origin: center; }
  .ball-left   { animation: pulseLeft var(--dur) linear infinite;   transform-box: fill-box; transform-origin: center; }

  @keyframes moveBall {
    0%   { transform: translate(0px, 0px); }
    20%  { transform: translate(164px, 164px); }
    40%  { transform: translate(0px, 328px); }
    60%  { transform: translate(-164px, 164px); }
    80%  { transform: translate(0px, 0px); }
    100% { transform: translate(0px, 0px); }
  }

  @keyframes drawDiamond {
    0%   { stroke-dashoffset: 1; }
    20%  { stroke-dashoffset: 0.75; }
    40%  { stroke-dashoffset: 0.5; }
    60%  { stroke-dashoffset: 0.25; }
    80%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes resetFade {
    0%   { opacity: 1; }
    95%  { opacity: 1; }
    97%  { opacity: 0; }
    99%  { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes pulseTop {
    0%   { transform: scale(1); }
    78%  { transform: scale(1); }
    80%  { transform: scale(1.4); }
    84%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  @keyframes pulseRight {
    0%   { transform: scale(1); }
    18%  { transform: scale(1); }
    20%  { transform: scale(1.4); }
    24%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  @keyframes pulseBottom {
    0%   { transform: scale(1); }
    38%  { transform: scale(1); }
    40%  { transform: scale(1.4); }
    44%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  @keyframes pulseLeft {
    0%   { transform: scale(1); }
    58%  { transform: scale(1); }
    60%  { transform: scale(1.4); }
    64%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
</style>

<!-- background -->
<path fill="#0B1220" d="M128,16h256c61.9,0,112,50.1,112,112v256c0,61.9-50.1,112-112,112H128
  c-61.9,0-112-50.1-112-112V128C16,66.1,66.1,16,128,16z"/>

<!-- static W (always fully visible, no draw animation) -->
<path d="M164,178l38,162l54-104l54,104l38-162"
  fill="none" stroke="#FFFFFF" stroke-width="34"
  stroke-linecap="round" stroke-linejoin="round"/>

<!-- animated diamond line + moving ball (fade out/in on loop reset) -->
<g class="dynamic">
  <path class="diamond-line" pathLength="1"
    d="M256,92l164,164L256,420L92,256L256,92z"
    fill="none" stroke="#F5A524" stroke-width="12"
    stroke-linecap="round" stroke-linejoin="round"/>

  <circle class="moving-ball" cx="256" cy="92" r="26" fill="#F5A524"/>
</g>

<!-- static corner balls (always visible, pulse on hit) -->
<circle class="ball-top"    cx="256" cy="92"  r="26" fill="#F5A524"/>
<circle class="ball-right"  cx="420" cy="256" r="26" fill="#F5A524"/>
<circle class="ball-bottom" cx="256" cy="420" r="26" fill="#F5A524"/>
<circle class="ball-left"   cx="92"  cy="256" r="26" fill="#F5A524"/>
</svg>
